<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tai Nguyen</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link type="image/x-icon" href="https://github.com/taint1811/taint1811.github.io/assets/4694495/e8084ead-6250-45fc-a39e-be39d6321ad5" rel="shortcut icon">
    <meta name="description" content="Tai Nguyen">
    <meta name="keykeywordsword" content="taint, taiceo, taidev, taichutich">
    <meta property="og:title" content="Tai Nguyen">
    <meta property="og:description" content="Tai Nguyen">
    <meta property="og:image" content="https://github.com/taint1811/taint1811.github.io/assets/4694495/e8084ead-6250-45fc-a39e-be39d6321ad5">

    <meta name="robots" content="noindex, nofollow">
    <link href="assets/sunflower.css" rel="stylesheet" media="all">
    <link href="assets/style.css" rel="stylesheet" media="all">
    <link href="assets/myxcodi.css" rel="stylesheet" media="all">

</head>

<body>
    <div class="wrapper2">
        <div class="message">
            <h1 class="gradient-text">
                <span id="typewriter-title"></span><span class="cursor cursor-title">|</span>
            </h1>
            <p class="gradient-text typewriter-line">
                <span id="typewriter-desc"></span><span class="cursor cursor-desc">|</span>
            </p>
        </div>
        <div class="copyright2 ">
            <p class="block  fw400 gradient-text-right ">© 2011 - Made with <i class="x-ic x-ic-account-wishlist"></i></p>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="scene">
                    <div class="wing-left"></div>
                    <div class="wing-right"></div>
                    <div class="exhaust"></div>
                    <div class="capsule">
                        <div class="top">
                            <div class="shadow"></div>
                        </div>
                        <div class="base"></div>
                    </div>
                    <div class="window-big"></div>
                    <div class="window-small"></div>
                    <div class="fire-1"></div>
                    <div class="fire-2"></div>
                    <div class="fire-3"></div>
                    <div class="fire-4"></div>
                    <div class="spark-1"></div>
                    <div class="spark-2"></div>
                    <div class="spark-3"></div>
                    <div class="spark-4"></div>
                    <div class="star star--1"></div>
                    <div class="star star--2"></div>
                    <div class="star star--3"></div>
                    <div class="star star--4"></div>
                    <div class="star star--5"></div>
                    <div class="star star--6"></div>
                    <div class="star star--7"></div>
                    <div class="star star--8"></div>
                    <div class="star star--9"></div>
                    <div class="star star--10"></div>
                    <div class="star star--11"></div>
                    <div class="star star--12"></div>
                    <div class="star star--13"></div>
                    <div class="star star--14"></div>
                    <div class="star star--15"></div>
                    <div class="star star--16"></div>
                </div>
            </div>
        </div>

    </div>

    <style>
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .message h1 {
            margin-bottom: 5px;
            white-space: nowrap;
            font-size: clamp(20px, 5vw, 62px) !important;
        }
        .typewriter-line {
            margin-top: 0;
            font-weight: 400;
            white-space: nowrap;
            font-size: clamp(14px, 3.5vw, 42px);
            line-height: 1.3;
            display: block;
        }
        .typewriter-line::after {
            content: '\200b';
        }
        .message h1 {
            line-height: 1.3;
        }
        .cursor-desc {
            visibility: hidden;
        }
        .cursor-desc.active {
            visibility: visible;
        }
    </style>

    <script>
        const messages = [
            { title: "CEO & Tech Founder", desc: "ERP • SaaS • Digital Growth" },
            { title: "Senior Full-Stack Engineer", desc: "Backend • Frontend • Mobile" },
            { title: "Enterprise Software & ERP", desc: "Built for real-world operations." },
            { title: "Digital Marketing Systems", desc: "Tracking. Automation. Conversion." },
            { title: "Global Outsourcing", desc: "Build & scale worldwide." },
            { title: "Product Builder", desc: "From idea to revenue." }
        ];

        let msgIndex = 0;
        let phase = 'typeTitle'; // typeTitle -> typeDesc -> pause -> deleteDesc -> deleteTitle -> next
        let charIndex = 0;

        const titleEl = document.getElementById('typewriter-title');
        const descEl = document.getElementById('typewriter-desc');
        const cursorTitle = document.querySelector('.cursor-title');
        const cursorDesc = document.querySelector('.cursor-desc');

        function type() {
            const current = messages[msgIndex];
            let delay = 80;

            switch(phase) {
                case 'typeTitle':
                    cursorTitle.style.visibility = 'visible';
                    cursorDesc.style.visibility = 'hidden';
                    titleEl.textContent = current.title.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex >= current.title.length) {
                        phase = 'typeDesc';
                        charIndex = 0;
                        delay = 300;
                    }
                    break;

                case 'typeDesc':
                    cursorTitle.style.visibility = 'hidden';
                    cursorDesc.style.visibility = 'visible';
                    descEl.textContent = current.desc.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex >= current.desc.length) {
                        phase = 'pause';
                        delay = 2500;
                    }
                    break;

                case 'pause':
                    phase = 'deleteDesc';
                    charIndex = current.desc.length;
                    break;

                case 'deleteDesc':
                    descEl.textContent = current.desc.substring(0, charIndex - 1);
                    charIndex--;
                    delay = 40;
                    if (charIndex <= 0) {
                        phase = 'deleteTitle';
                        charIndex = current.title.length;
                        cursorTitle.style.visibility = 'visible';
                        cursorDesc.style.visibility = 'hidden';
                    }
                    break;

                case 'deleteTitle':
                    titleEl.textContent = current.title.substring(0, charIndex - 1);
                    charIndex--;
                    delay = 40;
                    if (charIndex <= 0) {
                        phase = 'typeTitle';
                        msgIndex = (msgIndex + 1) % messages.length;
                        delay = 500;
                    }
                    break;
            }

            setTimeout(type, delay);
        }

        type();
    </script>
</body>

</html>
